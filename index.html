<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evolución de Hardware - Proyecto Universitario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Análisis de Hardware: Comparativa de Placas Base</h1>

        <section>
            <h2>1. Tarjeta Madre Antigua (Socket 7 / VIA)</h2>
            <div class="image-wrapper">
                <img src="x2togwe5cc831.jpg" usemap="#mapa-vieja" class="placa-img">
                <map name="mapa-vieja">
    <area shape="rect" coords="565,285,670,410" alt="Northbridge" data-info="NORTHBRIDGE VIA VT82C598MVP: Chip maestro que interconecta el procesador con la memoria RAM y el bus AGP.">
    <area shape="rect" coords="550,580,685,735" alt="Southbridge" data-info="SOUTHBRIDGE VIA VT82C586B: Gestiona periféricos de baja velocidad, puertos IDE y comunicación con buses PCI/ISA.">

    <area shape="rect" coords="360,30,900,105" alt="SIMM" data-info="RANURAS SIMM: Memoria RAM de 72 pines. Eran módulos que debían instalarse por pares.">
    <area shape="rect" coords="360,120,900,240" alt="DIMM" data-info="RANURAS DIMM: Soporta memoria SDRAM de 168 pines, más rápida y eficiente que la tecnología SIMM.">

    <area shape="rect" coords="825,540,1085,830" alt="Socket 7" data-info="SOCKET 7: Zócalo de conexión para procesadores Pentium. Es el cerebro que ejecuta todas las instrucciones del PC.">

    <area shape="rect" coords="385,410,680,485" alt="AGP" data-info="PUERTO AGP: Ranura dedicada exclusivamente para la tarjeta aceleradora de video 3D.">
    <area shape="rect" coords="265,545,715,835" alt="PCI" data-info="RANURAS PCI (Blancas): Bus para tarjetas de expansión de 32 bits como sonido, red o USB adicional.">
    <area shape="rect" coords="215,895,850,1030" alt="ISA" data-info="RANURAS ISA (Negras): El estándar más antiguo de expansión, utilizado para hardware heredado.">

    <area shape="rect" coords="300,245,510,360" alt="AT Power" data-info="CONECTOR AT: Entrada de energía. Se conecta mediante dos piezas (P8 y P9) con los cables negros al centro.">
    <area shape="rect" coords="190,245,265,470" alt="IDE" data-info="PUERTOS IDE: Conectores para cables planos que comunican discos duros y unidades de CD-ROM.">
    <area shape="circle" coords="720,830,45" alt="Pila" data-info="BATERÍA CMOS: Suministra energía al chip que guarda la fecha, hora y configuración de la BIOS.">
    <area shape="rect" coords="230,680,285,860" alt="BIOS" data-info="CHIP BIOS: Contiene el programa básico que inicia el hardware antes de cargar el sistema operativo.">
</map>
            </div>
        </section>

        <section>
            <h2>2. Tarjeta Madre Moderna (MSI X870E - AM5)</h2>
            <div class="image-wrapper">
                <img src="msi-mag-x870e-gaming_max_wifi-2d.png" usemap="#mapa-moderna" class="placa-img">
                <map name="mapa-moderna">
    <area shape="rect" coords="555,295,840,600" alt="Socket AM5" data-info="SOCKET AM5: Zócalo LGA moderno para CPUs Ryzen 9000. Los pines están en la placa para proteger el procesador.">
    <area shape="rect" coords="1010,165,1185,835" alt="RAM DDR5" data-info="SLOTS DDR5: Memoria de alta velocidad que incluye gestión de energía y corrección de errores integrada.">
    <area shape="rect" coords="350,895,950,1080" alt="PCIe 5.0" data-info="PCIe GEN 5: Ranura reforzada para tarjetas gráficas. Soporta el ancho de banda necesario para el futuro.">
    <area shape="rect" coords="1005,895,1175,1330" alt="Chipset" data-info="CHIPSET X870E: El hub central que controla el USB 4.0, Wi-Fi 7 y distribuye datos a los periféricos.">
    <area shape="rect" coords="350,755,945,830" alt="M.2" data-info="M.2 NVMe: Slot para almacenamiento de estado sólido ultra rápido con disipador térmico incluido.">
    <area shape="rect" coords="130,65,450,685" alt="VRM" data-info="FASES VRM: Componentes que limpian y regulan la electricidad que entra al procesador.">
    <area shape="circle" coords="275,1280,48" alt="Pila" data-info="PILA CMOS: Mantiene la alimentación del chip de memoria volátil que guarda la configuración del sistema.">
</map>
            </div>
        </section>

        <div id="info-box">Pasa el ratón sobre un componente para ver su descripción técnica</div>
    </div>

</body>
</html>
