<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evolución de Hardware - Proyecto Universitario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Análisis de Hardware: Comparativa de Placas Base</h1>

        <section>
            <h2>1. Tarjeta Madre Antigua (Socket 7 / VIA)</h2>
            <div class="image-wrapper">
                <img src="image_71f35c.jpg" usemap="#mapa-vieja" class="placa-img">
                <map name="mapa-vieja">
                    <area shape="rect" coords="870,730,1080,1110" alt="Socket 7" data-info="SOCKET 7: Zócalo de inserción para procesadores Pentium. Permite la comunicación física entre el CPU y la placa.">
                    <area shape="rect" coords="690,370,830,580" alt="Northbridge" data-info="NORTHBRIDGE VIA: Chipset principal que gestiona la comunicación entre el CPU, la RAM y el puerto AGP.">
                    <area shape="rect" coords="720,830,850,1050" alt="Southbridge" data-info="SOUTHBRIDGE VIA: Controlador de entrada/salida para discos IDE, puertos seriales y ranuras ISA/PCI.">
                    
                    <area shape="rect" coords="340,20,930,150" alt="SIMM" data-info="RANURAS SIMM: Memoria RAM de 72 pines. Se instalaban en pares para completar el bus de datos del sistema.">
                    <area shape="rect" coords="340,155,930,285" alt="DIMM" data-info="RANURAS DIMM: Soporta memoria SDRAM de 168 pines, ofreciendo mayor velocidad que los módulos SIMM.">
                    
                    <area shape="rect" coords="350,590,760,720" alt="AGP" data-info="PUERTO AGP: Ranura dedicada exclusivamente a la tarjeta de video para aceleración de gráficos 3D.">
                    <area shape="rect" coords="370,730,710,1240" alt="PCI" data-info="RANURAS PCI: Bus estándar para tarjetas de expansión como red, sonido o controladores adicionales.">
                    <area shape="rect" coords="300,1245,870,1460" alt="ISA" data-info="RANURAS ISA (Negras): El estándar más antiguo de expansión para hardware de baja velocidad.">
                    
                    <area shape="rect" coords="290,270,390,600" alt="IDE" data-info="PUERTOS IDE: Conexiones para cables planos de 40 u 80 hilos destinados a discos duros y CD-ROM.">
                    <area shape="rect" coords="400,285,600,450" alt="AT Power" data-info="CONECTOR AT: Entrada de energía dividida en dos piezas (P8 y P9). Suministra electricidad a la placa.">
                    <area shape="rect" coords="305,930,375,1220" alt="BIOS" data-info="CHIP BIOS: Contiene el firmware necesario para el arranque del sistema y el reconocimiento de hardware.">
                    <area shape="circle" coords="740,1170,55" alt="Pila" data-info="BATERÍA CMOS: Mantiene la configuración de la BIOS y la fecha del sistema cuando el PC se apaga.">
                    <area shape="rect" coords="260,50,335,260" alt="Puertos Panel" data-info="PUERTOS TRASEROS: Conexiones para teclado DIN, puertos serie (COM) y paralelo (LPT).">
                </map>
            </div>
        </section>

        <section>
            <h2>2. Tarjeta Madre Moderna (MSI X870E - AM5)</h2>
            <div class="image-wrapper">
                <img src="msi-mag-x870e-gaming_max_wifi-2d.jpg" usemap="#mapa-moderna" class="placa-img">
                <map name="mapa-moderna">
                    <area shape="rect" coords="540,280,850,610" alt="Socket AM5" data-info="SOCKET AM5: Zócalo LGA 1718 para procesadores Ryzen. Los pines están en la placa para mayor seguridad.">
                    <area shape="rect" coords="120,50,460,690" alt="Disipadores" data-info="DISIPADORES VRM: Enfrían los componentes que regulan el voltaje del procesador para evitar sobrecalentamiento.">
                    <area shape="rect" coords="280,45,490,105" alt="EPS" data-info="CONECTORES EPS: Doble entrada de 8 pines para alimentar procesadores de alto rendimiento.">
                    
                    <area shape="rect" coords="1000,150,1195,845" alt="DDR5" data-info="SLOTS DDR5: Memoria RAM de última generación con corrección de errores (ECC) y velocidades extremas.">
                    <area shape="rect" coords="340,740,960,840" alt="M.2 Gen5" data-info="M.2 PCI-E 5.0: Ranura para SSDs NVMe de alta velocidad con disipador Shield Frozr incluido.">
                    <area shape="rect" coords="635,1380,790,1470" alt="SATA" data-info="PUERTOS SATA: Conectores para unidades de almacenamiento tradicionales (HDD o SSD de 2.5').">
                    
                    <area shape="rect" coords="340,880,965,1090" alt="PCIe 5.0" data-info="SLOT PCIe 5.0: Ranura reforzada para tarjetas gráficas, ofreciendo el máximo ancho de banda actual.">
                    <area shape="rect" coords="995,880,1185,1340" alt="Chipset X870E" data-info="CHIPSET X870E: Gestiona la conectividad de alta velocidad, incluyendo USB 4.0 y Wi-Fi 7.">
                    
                    <area shape="rect" coords="1220,390,1260,730" alt="ATX 24" data-info="ATX 24-PIN: Entrada principal de energía para todos los componentes lógicos de la placa.">
                    <area shape="rect" coords="170,1390,335,1470" alt="Audio" data-info="AUDIO BOOST: Procesador de sonido aislado para eliminar ruidos eléctricos y mejorar la calidad.">
                    <area shape="rect" coords="1060,50,1200,135" alt="Debug" data-info="EZ DEBUG LED: Indicadores rápidos para detectar fallos en CPU, RAM, GPU o Booteo.">
                    <area shape="circle" coords="265,1295,50" alt="Pila" data-info="PILA CMOS: Mantiene la alimentación del chip que guarda la configuración de la BIOS.">
                    <area shape="rect" coords="375,1420,470,1475" alt="ARGB" data-info="HEADERS ARGB: Conectores para controlar la iluminación LED sincronizada del gabinete.">
                    <area shape="rect" coords="750,1420,930,1475" alt="JFP1" data-info="PANEL FRONTAL: Pines para conectar los botones de encendido y reinicio del chasis.">
                </map>
            </div>
        </section>

        <div id="info-box">Pasa el ratón sobre un componente para ver su descripción técnica</div>
    </div>

</body>
</html>
