<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evolución de Hardware - Proyecto Universitario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Análisis de Hardware: Comparativa de Placas Base</h1>

        <section>
            <h2>1. Tarjeta Madre Antigua (Socket 7 / VIA)</h2>
            <div class="image-wrapper">
                <img src="x2togwe5cc831.jpg" usemap="#mapa-vieja" class="placa-img">
   <map name="image-map">
    <area shape="rect" coords="575,300,680,410" alt="VIA Northbridge" data-info="NORTHBRIDGE VIA: El chip maestro que comunica el procesador con la memoria RAM y el video AGP.">
    <area shape="rect" coords="560,600,670,710" alt="VIA Southbridge" data-info="SOUTHBRIDGE VIA: Controla los discos IDE y las ranuras de expansión PCI/ISA.">
    <area shape="rect" coords="820,550,1110,830" alt="Socket 7" data-info="SOCKET 7: Zócalo donde se instala el procesador (Pentium/AMD K6).">

    <area shape="rect" coords="350,30,890,100" alt="SIMM" data-info="RANURAS SIMM (Blancas): Memoria antigua de 72 pines. Debían instalarse por pares.">
    <area shape="rect" coords="350,125,890,230" alt="DIMM" data-info="RANURAS DIMM (Negras): Soporta memoria SDRAM de 168 pines, más rápida que la SIMM.">

    <area shape="rect" coords="275,540,730,830" alt="PCI" data-info="RANURAS PCI (Blancas): Bus para tarjetas de sonido, red o controladores adicionales.">
    <area shape="rect" coords="215,890,870,1030" alt="ISA" data-info="RANURAS ISA (Negras): Las ranuras más antiguas y largas, usadas para hardware de los 80/90.">
    <area shape="rect" coords="400,415,650,470" alt="AGP" data-info="PUERTO AGP (Café): Ranura dedicada exclusivamente para la tarjeta de video 3D.">

    <area shape="rect" coords="310,250,510,340" alt="Poder AT" data-info="CONECTOR AT: Entrada de energía. Usa dos conectores (P8 y P9) de la fuente de poder.">
    <area shape="rect" coords="185,250,265,460" alt="IDE" data-info="PUERTOS IDE: Conexiones para cables planos de discos duros y lectoras de CD.">
    <area shape="rect" coords="45,560,145,710" alt="Winbond" data-info="CHIP WINBOND: Controlador Super I/O para teclado, mouse y puertos seriales.">
    <area shape="rect" coords="60,720,150,910" alt="BIOS" data-info="CHIP BIOS AWARD: Firmware inicial que arranca el sistema y reconoce el hardware.">
    <area shape="rect" coords="5,150,150,340" alt="Teclado DIN" data-info="PUERTO DIN-5: Conector circular grande para teclados antiguos.">
    <area shape="rect" coords="820,50,1130,220" alt="VRM" data-info="ETAPA VRM: Regula y limpia la electricidad para que el procesador no se queme.">
</map>
            </div>
        </section>

        <section>
            <h2>2. Tarjeta Madre Moderna (MSI X870E - AM5)</h2>
            <div class="image-wrapper">
                <img src="msi-mag-x870e-gaming_max_wifi-2d.png" usemap="#mapa-moderna" class="placa-img">
                <map name="mapa-moderna">
    <area shape="rect" coords="555,295,840,600" alt="Socket AM5" data-info="SOCKET AM5: Zócalo LGA moderno para CPUs Ryzen 9000. Los pines están en la placa para proteger el procesador.">
    <area shape="rect" coords="1010,165,1185,835" alt="RAM DDR5" data-info="SLOTS DDR5: Memoria de alta velocidad que incluye gestión de energía y corrección de errores integrada.">
    <area shape="rect" coords="350,895,950,1080" alt="PCIe 5.0" data-info="PCIe GEN 5: Ranura reforzada para tarjetas gráficas. Soporta el ancho de banda necesario para el futuro.">
    <area shape="rect" coords="1005,895,1175,1330" alt="Chipset" data-info="CHIPSET X870E: El hub central que controla el USB 4.0, Wi-Fi 7 y distribuye datos a los periféricos.">
    <area shape="rect" coords="350,755,945,830" alt="M.2" data-info="M.2 NVMe: Slot para almacenamiento de estado sólido ultra rápido con disipador térmico incluido.">
    <area shape="rect" coords="130,65,450,685" alt="VRM" data-info="FASES VRM: Componentes que limpian y regulan la electricidad que entra al procesador.">
    <area shape="circle" coords="275,1280,48" alt="Pila" data-info="PILA CMOS: Mantiene la alimentación del chip de memoria volátil que guarda la configuración del sistema.">
</map>
            </div>
        </section>

        <div id="info-box">Pasa el ratón sobre un componente para ver su descripción técnica</div>
    </div>
