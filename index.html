<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evolución de Placas Base - Comparativa Completa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 

    <div class="container">
        <h1>Análisis de Hardware: Evolución de la Tarjeta Madre</h1>

        <section>
            <h2>1. Tarjeta Madre Vintage (Era Pentium/K6)</h2>
            <div class="image-wrapper">
                <img src="x2togwe5cc831.jpg" usemap="#mapa-vieja" class="placa-img" alt="Placa Base Antigua">
                <map name="mapa-vieja">
                    <area shape="rect" coords="585,488,720,740" alt="Socket 7" data-info="SOCKET 7: Zócalo para procesadores de mediados de los 90 como el Pentium original o AMD K6.">
                    <area shape="rect" coords="463,248,550,388" alt="Northbridge" data-info="NORTHBRIDGE VIA: El chip principal que conecta el CPU con la memoria RAM.">
                    <area shape="rect" coords="480,557,566,698" alt="Southbridge" data-info="SOUTHBRIDGE VIA: Controla los componentes de entrada/salida y discos duros.">
                    
                    <area shape="rect" coords="230,17,615,100" alt="SIMM" data-info="RANURAS SIMM: Memoria RAM antigua de 30 o 72 pines.">
                    <area shape="rect" coords="230,105,615,190" alt="DIMM" data-info="RANURAS DIMM: Precursoras de las RAM actuales, usadas para memoria SDRAM.">
                    
                    <area shape="rect" coords="235,397,510,480" alt="AGP" data-info="PUERTO AGP: Diseñado específicamente para las primeras tarjetas aceleradoras de gráficos 3D.">
                    <area shape="rect" coords="247,485,472,828" alt="PCI" data-info="RANURAS PCI (Blancas): Estándar para conectar tarjetas de sonido o red en aquella época.">
                    <area shape="rect" coords="203,827,580,974" alt="ISA" data-info="RANURAS ISA (Negras): El estándar más antiguo de esta placa para hardware heredado.">
                    
                    <area shape="rect" coords="194,185,263,398" alt="IDE" data-info="PUERTOS IDE/FDD: Conexiones para discos duros de cable plano y disqueteras.">
                    <area shape="rect" coords="267,192,402,300" alt="AT Power" data-info="CONECTOR AT: Entrada de energía de las fuentes antiguas (usaba conectores P8 y P9).">
                    <area shape="circle" coords="492,778,35" alt="Pila" data-info="BATERÍA CMOS: Mantiene la hora y la configuración básica de la BIOS.">
                    <area shape="rect" coords="206,621,254,816" alt="BIOS" data-info="CHIP BIOS/AWARD: Contiene el software de arranque del sistema.">
                </map>
            </div>
        </section>

        <section>
            <h2>2. Tarjeta Madre de Vanguardia (MSI X870E - 2026)</h2>
            <div class="image-wrapper">
                <img src="msi-mag-x870e-gaming_max_wifi-2d.png" usemap="#mapa-moderna" class="placa-img" alt="Placa Base MSI Moderna">
                <map name="mapa-moderna">
                    <area shape="rect" coords="360,190,570,410" alt="Socket AM5" data-info="SOCKET AM5: Zócalo LGA para procesadores AMD Ryzen de última generación (Ryzen 9000).">
                    <area shape="rect" coords="80,35,310,465" alt="VRM" data-info="SISTEMA VRM: Disipadores masivos que regulan el voltaje para CPUs de alto consumo.">
                    <area shape="rect" coords="190,30,325,70" alt="EPS" data-info="DUAL 8-PIN EPS: Doble entrada de energía para máxima estabilidad eléctrica.">
                    
                    <area shape="rect" coords="668,105,693,565" alt="DDR5 1" data-info="DDR5 SLOT 1: Memoria de última generación con velocidades que superan los 8000 MT/s.">
                    <area shape="rect" coords="703,105,728,565" alt="DDR5 2" data-info="DDR5 SLOT 2: Ranura principal para arquitectura Dual-Channel.">
                    <area shape="rect" coords="738,105,763,565" alt="DDR5 3" data-info="DDR5 SLOT 3: Ranura de expansión de memoria.">
                    <area shape="rect" coords="773,105,798,565" alt="DDR5 4" data-info="DDR5 SLOT 4: Ranura para maximizar la capacidad total de RAM.">

                    <area shape="rect" coords="230,495,640,560" alt="M.2 Gen5" data-info="M.2 SHIELD FROZR: Slot para SSDs NVMe PCIe 5.0 con velocidades extremas de lectura/escritura.">
                    <area shape="rect" coords="230,590,645,630" alt="PCIe 5.0" data-info="PCIe STEEL ARMOR: Ranura reforzada para tarjetas gráficas pesadas (RTX 5000 / RX 8000).">
                    <area shape="rect" coords="665,590,790,895" alt="Chipset" data-info="CHIPSET X870E: El cerebro de la placa que gestiona USB 4.0, Wi-Fi 7 y múltiples líneas PCIe.">
                    <area shape="rect" coords="635,920,795,980" alt="SATA" data-info="PUERTOS SATA: Para conectar discos de almacenamiento masivo tradicionales.">
                    
                    <area shape="rect" coords="815,260,840,490" alt="ATX" data-info="ATX 24-PIN: Entrada principal de energía desde la fuente de poder.">
                    <area shape="rect" coords="115,930,225,980" alt="Audio" data-info="AUDIO BOOST: Sistema de sonido aislado con componentes de alta fidelidad.">
                    <area shape="rect" coords="710,35,805,90" alt="Debug" data-info="EZ DEBUG LED: Indicadores rápidos para saber si falla el CPU, RAM o la Gráfica.">
                </map>
            </div>
        </section>

        <div id="info-box">Pasa el ratón sobre un componente para conocer su función</div>
    </div>

</body>
</html>
