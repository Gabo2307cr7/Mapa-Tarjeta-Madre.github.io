<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evolución de Hardware - Proyecto Universitario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Análisis de Hardware: Comparativa de Placas Base</h1>

        <section>
            <h2>1. Tarjeta Madre Antigua (Socket 7 / VIA)</h2>
            <div class="image-wrapper">
                <img src="x2togwe5cc831.jpg" usemap="#mapa-vieja" class="placa-img">
   <map name="mapa-vieja">
    <area shape="rect" coords="575,300,660,390" alt="Northbridge" data-info="NORTHBRIDGE VIA: Chip maestro que interconecta el procesador con la memoria RAM y el bus AGP.">
    <area shape="rect" coords="560,600,670,710" alt="Southbridge" data-info="SOUTHBRIDGE VIA: Gestiona periféricos de baja velocidad, puertos IDE y comunicación con buses PCI/ISA.">

    <area shape="rect" coords="370,30,880,100" alt="SIMM" data-info="RANURAS SIMM: Memoria RAM de 72 pines. Se instalaban por pares (tecnología de los 90).">
    <area shape="rect" coords="370,125,880,220" alt="DIMM" data-info="RANURAS DIMM: Soporta memoria SDRAM de 168 pines, más rápida que la tecnología SIMM.">

    <area shape="rect" coords="850,560,1050,810" alt="Socket 7" data-info="SOCKET 7: Zócalo para procesadores Pentium. Es el cerebro que ejecuta las instrucciones del PC.">

    <area shape="rect" coords="400,415,650,470" alt="AGP" data-info="PUERTO AGP: Ranura café dedicada exclusivamente para la tarjeta aceleradora de video 3D.">
    <area shape="rect" coords="280,560,700,810" alt="PCI" data-info="RANURAS PCI (Blancas): Bus para tarjetas de expansión como sonido, red o controladores.">
    <area shape="rect" coords="230,910,830,1010" alt="ISA" data-info="RANURAS ISA (Negras): El estándar más antiguo de expansión para hardware heredado.">

    <area shape="rect" coords="310,260,500,345" alt="AT Power" data-info="CONECTOR AT: Entrada de energía de la fuente de poder (conectores P8 y P9).">
    <area shape="rect" coords="200,260,255,450" alt="IDE" data-info="PUERTOS IDE: Conexiones para discos duros y unidades de CD-ROM.">
    <area shape="circle" coords="720,830,40" alt="Pila" data-info="BATERÍA CMOS: Guarda la fecha, hora y configuración de la BIOS mediante energía constante.">
    <area shape="rect" coords="235,690,275,850" alt="BIOS" data-info="CHIP BIOS: Programa básico que inicia el hardware antes de cargar el sistema operativo.">
</map>
            </div>
        </section>

        <section>
            <h2>2. Tarjeta Madre Moderna (MSI X870E - AM5)</h2>
            <div class="image-wrapper">
                <img src="msi-mag-x870e-gaming_max_wifi-2d.png" usemap="#mapa-moderna" class="placa-img">
                <map name="mapa-moderna">
    <area shape="rect" coords="555,295,840,600" alt="Socket AM5" data-info="SOCKET AM5: Zócalo LGA moderno para CPUs Ryzen 9000. Los pines están en la placa para proteger el procesador.">
    <area shape="rect" coords="1010,165,1185,835" alt="RAM DDR5" data-info="SLOTS DDR5: Memoria de alta velocidad que incluye gestión de energía y corrección de errores integrada.">
    <area shape="rect" coords="350,895,950,1080" alt="PCIe 5.0" data-info="PCIe GEN 5: Ranura reforzada para tarjetas gráficas. Soporta el ancho de banda necesario para el futuro.">
    <area shape="rect" coords="1005,895,1175,1330" alt="Chipset" data-info="CHIPSET X870E: El hub central que controla el USB 4.0, Wi-Fi 7 y distribuye datos a los periféricos.">
    <area shape="rect" coords="350,755,945,830" alt="M.2" data-info="M.2 NVMe: Slot para almacenamiento de estado sólido ultra rápido con disipador térmico incluido.">
    <area shape="rect" coords="130,65,450,685" alt="VRM" data-info="FASES VRM: Componentes que limpian y regulan la electricidad que entra al procesador.">
    <area shape="circle" coords="275,1280,48" alt="Pila" data-info="PILA CMOS: Mantiene la alimentación del chip de memoria volátil que guarda la configuración del sistema.">
</map>
            </div>
        </section>

        <div id="info-box">Pasa el ratón sobre un componente para ver su descripción técnica</div>
    </div>
